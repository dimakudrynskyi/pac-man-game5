<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #gameContainer {
      position: relative;
    }
    canvas {
      border: 2px solid #fff;
      display: block;
      background-color: #000;
    }
    #score {
      color: #fff;
      font-size: 20px;
      margin-bottom: 10px;
      text-align: center;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 40px;
      text-align: center;
      border-radius: 10px;
      display: none;
      z-index: 100;
    }
    #gameOver h1 {
      font-size: 40px;
      margin: 0 0 20px 0;
    }
    #gameOver p {
      font-size: 20px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="gameOver">
      <h1>Game Over!</h1>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p>Refresh to play again</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
