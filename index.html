<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }

    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: #FFD700;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    #gameCanvas {
      border: 3px solid #FFD700;
      background: #000000;
      display: block;
      margin: 20px auto;
      cursor: none;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    #score {
      color: #FFD700;
      font-size: 24px;
      margin: 20px 0;
      font-weight: bold;
    }

    #gameOverScreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      flex-direction: column;
    }

    #gameOverScreen h2 {
      color: #FFD700;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    #finalScore {
      color: #FF6B6B;
      font-size: 36px;
      margin-bottom: 40px;
      font-weight: bold;
    }

    #restartButton {
      padding: 15px 40px;
      font-size: 20px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border: none;
      border-radius: 8px;
      color: #000000;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    #restartButton:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    }

    #restartButton:active {
      transform: scale(0.95);
    }

    .instructions {
      color: #FFFFFF;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 PAC-MAN GAME</h1>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="score">Score: 0</div>
    <div class="instructions">
      <p>Use Arrow Keys or WASD to move Pac-Man</p>
      <p>Collect pellets to earn points. Avoid ghosts!</p>
    </div>
  </div>

  <div id="gameOverScreen">
    <h2>GAME OVER!</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restartButton">RESTART GAME</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
