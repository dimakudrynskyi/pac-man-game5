<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 400px;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
            display: block;
        }
        #score {
            color: #0f0;
            font-size: 18px;
            margin-top: 10px;
            text-align: center;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border: 2px solid #fff;
        }
        #gameOverScreen.show {
            display: flex;
        }
        #gameOverText {
            color: #f00;
            font-size: 40px;
            margin-bottom: 20px;
        }
        #finalScore {
            color: #0f0;
            font-size: 24px;
            margin-bottom: 30px;
        }
        #restartBtn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #0f0;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #restartBtn:hover {
            background-color: #0f0;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="score">Score: 0</div>
        <div id="gameOverScreen">
            <div id="gameOverText">GAME OVER</div>
            <div id="finalScore">Final Score: 0</div>
            <button id="restartBtn">Restart Game</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
